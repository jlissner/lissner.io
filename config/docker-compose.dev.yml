# Dev-only Postgres (project name: lissnerio-dev).
# Use scripts/docker-compose-dev.sh — not the prod host stack.
services:
  postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in config/.env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/.env.local}
      POSTGRES_DB: postgres
      VITE_GRAPHQL_DATABASE_NAME: ${VITE_GRAPHQL_DATABASE_NAME:-lissner}
      MEDIA_DATABASE_NAME: ${MEDIA_DATABASE_NAME:-media}
      MEDIA_TEST_DATABASE_NAME: ${MEDIA_TEST_DATABASE_NAME:-media_test}
    ports:
      # Dev host bind (default 5432 via config/.env.local).
      - "127.0.0.1:${INTERNAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/docker/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
