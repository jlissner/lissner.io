services:
  api:
    env_file: "config/.env.prod"
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - app-data:${DATA_DIR}
    environment:
      - NODE_ENV=${NODE_ENV}
      - SERVER_PORT=${SERVER_PORT}
      - OLLAMA_HOST=http://ollama:11434
      - DATA_DIR=${DATA_DIR}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${VITE_API_HOST}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certResolver=letsencrypt"
      - "traefik.http.routers.api-http.rule=Host(`${VITE_API_HOST}`)"
      - "traefik.http.routers.api-http.entrypoints=webhttp"
      - "traefik.http.routers.api-http.middlewares=api-redirect-https@docker"
      - "traefik.http.routers.api-http.service=api"
      - "traefik.http.middlewares.api-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.api-redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.api.loadbalancer.server.port=${SERVER_PORT}"
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ffmpeg -version >/dev/null 2>&1 && node -e "fetch(''http://127.0.0.1:''+process.env.SERVER_PORT+''/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    networks:
      - traefik
      - default

  ui:
    build:
      context: .
      dockerfile: packages/pics/Dockerfile
    ports:
      - "${VITE_PICS_UI_PORT}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`${VITE_PICS_UI_HOST}`)"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.routers.ui.service=ui"
      - "traefik.http.routers.ui.tls=true"
      - "traefik.http.routers.ui.tls.certResolver=letsencrypt"
      - "traefik.http.routers.ui-http.rule=Host(`${VITE_PICS_UI_HOST}`)"
      - "traefik.http.routers.ui-http.entrypoints=webhttp"
      - "traefik.http.routers.ui-http.middlewares=ui-redirect-https@docker"
      - "traefik.http.routers.ui-http.service=ui"
      - "traefik.http.middlewares.ui-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ui-redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.ui.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", 'test "$(wget -qO- http://127.0.0.1/health)" = OK']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - traefik

  postgres:
    image: postgres:16.13-bookworm
    environment:
      # Required via config/.env.prod or config/.env (no defaults — never commit secrets).
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in config/.env.prod or config/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/.env.prod or config/.env}
      INTERNAL_POSTGRES_PORT: ${INTERNAL_POSTGRES_PORT:?Set INTERNAL_POSTGRES_PORT in config/.env.prod or config/.env}
      POSTGRES_DB: postgres
      VITE_GRAPHQL_DATABASE_NAME: ${VITE_GRAPHQL_DATABASE_NAME:-lissner}
      MEDIA_DATABASE_NAME: ${MEDIA_DATABASE_NAME:-media}
      MEDIA_TEST_DATABASE_NAME: ${MEDIA_TEST_DATABASE_NAME:-media_test}
    ports:
      # Prod host bind — use 5433 in config/.env.prod so it does not clash with dev on 5432.
      - "127.0.0.1:${INTERNAL_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/docker/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  graphql:
    env_file: "config/.env.prod"
    build:
      context: .
      dockerfile: packages/graphql/Dockerfile
    ports:
      - "${VITE_GRAPHQL_PORT}:${VITE_GRAPHQL_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_GRAPHQL_PORT=${VITE_GRAPHQL_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphql.rule=Host(`${VITE_GRAPHQL_HOST}`)"
      - "traefik.http.routers.graphql.entrypoints=web"
      - "traefik.http.routers.graphql.service=graphql"
      - "traefik.http.routers.graphql.tls=true"
      - "traefik.http.routers.graphql.tls.certResolver=letsencrypt"
      - "traefik.http.routers.graphql-http.rule=Host(`${VITE_GRAPHQL_HOST}`)"
      - "traefik.http.routers.graphql-http.entrypoints=webhttp"
      - "traefik.http.routers.graphql-http.middlewares=graphql-redirect-https@docker"
      - "traefik.http.routers.graphql-http.service=graphql"
      - "traefik.http.middlewares.graphql-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.graphql-redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.graphql.loadbalancer.server.port=${VITE_GRAPHQL_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:''+process.env.VITE_GRAPHQL_PORT+''/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - traefik
      - default

  ollama:
    build:
      context: ./docker/ollama
    env_file:
      - config/.env.prod
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/ollama-models-ready && ollama list >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 1200s
    restart: unless-stopped

  traefik:
    image: traefik:v3
    command:
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:443"
      - "--entrypoints.webhttp.address=:80"
      # Traefik v3 defaults readTimeout to 60s (entire request incl. body). That
      # aborts large media uploads; match the API's 30m requestTimeout.
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=30m"
      - "--entrypoints.webhttp.transport.respondingTimeouts.readTimeout=30m"
      - "--providers.docker.network=lissnerio_traefik"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - traefik
    restart: unless-stopped

  admin-app:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
    ports:
      - "${VITE_ADMIN_UI_PORT}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-app.rule=Host(`${VITE_ADMIN_UI_HOST}`)"
      - "traefik.http.routers.admin-app.entrypoints=web"
      - "traefik.http.routers.admin-app.service=admin-app"
      - "traefik.http.routers.admin-app.tls=true"
      - "traefik.http.routers.admin-app.tls.certResolver=letsencrypt"
      - "traefik.http.routers.admin-app-http.rule=Host(`${VITE_ADMIN_UI_HOST}`)"
      - "traefik.http.routers.admin-app-http.entrypoints=webhttp"
      - "traefik.http.routers.admin-app-http.middlewares=admin-app-redirect-https@docker"
      - "traefik.http.routers.admin-app-http.service=admin-app"
      - "traefik.http.middlewares.admin-app-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.admin-app-redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.admin-app.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", 'test "$(wget -qO- http://127.0.0.1/health)" = OK']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - traefik

volumes:
  app-data:
  ollama-models:
  traefik-certs:
  postgres-data:

networks:
  traefik:
    driver: bridge
