name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DATA_DIR: ${{ vars.DATA_DIR }}
  FIRST_ADMIN_EMAIL: ${{ vars.FIRST_ADMIN_EMAIL }}
  OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
  OLLAMA_VISION_MODEL: ${{ vars.OLLAMA_VISION_MODEL }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  SERVER_HOST: ${{ vars.SERVER_HOST }}
  SERVER_PORT: ${{ vars.SERVER_PORT }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
  UI_HOST: ${{ vars.UI_HOST }}
  UI_PORT: ${{ vars.UI_PORT }}
  VITE_API_HOST: ${{ vars.VITE_API_HOST }}
  # Media API / Vitest (media_test). Server URL has no database path.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_SERVER_URL: postgres://postgres:postgres@127.0.0.1:5432?sslmode=disable
  MEDIA_DATABASE_NAME: media_test
  GRAPHQL_DATABASE_NAME: lissner

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test
    services:
      postgres:
        image: postgres:16.13-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create media_test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE media_test;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE lissner;"

      - name: Migrate media_test schema
        run: MEDIA_DATABASE_NAME=media_test npm run db:migrate:media

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
