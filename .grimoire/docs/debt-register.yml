  - id: debt-005
    category: duplication
    severity: medium
    location: ui/src (18 files, 39 sites)
    title: 'Repeated `err instanceof ApiError ? err.message : "<fallback>"` idiom'
    detail: >-
      The same error-to-message ternary appears 39 times across 18 UI files
      (and the in-progress react-query migration re-implements it again per
      component). There is no shared helper in ui/src/api.ts. A one-line
      `errorMessage(err, fallback)` helper would collapse all 39 sites to a
      single call and make the migrated components cleaner. High consistency
      payoff, trivial risk. Synergizes with debt-001 — do it first so migrated
      code uses the helper.
    fingerprint: dup-apierror-message-idiom
    metrics:
      sites: 39
      files: 18
      est_loc_recoverable: 40-60
    suggestion: >-
      Add `export function errorMessage(err: unknown, fallback: string): string`
      to ui/src/api.ts (returns err instanceof ApiError ? err.message :
      fallback). Add a unit test (matches repo helper-testing convention).
      Replace the 39 inline ternaries.
    effort: small
    consequences: >-
      Without it, error-message handling keeps being copy-pasted and drifts
      (some sites already vary the fallback wording inconsistently).
    causes: evolution
    quadrant: inadvertent-prudent
    status: resolved
    change_id: refactor-data-fetching
    resolution: >-
      errorMessage extracted to ui/src/api/errors.ts (with ApiError, moved out
      of the browser-coupled client.ts so it is unit-testable). Unit test added
      (errors.test.ts). Applied across admin tabs, data-explorer,
      duplicate-reviewer, the whole people area, the media-viewer faces hook +
      content, the media search/bulk-action hooks, backup-page, and login-page.
      All simple `err instanceof ApiError ? err.message : fallback` ternaries
      removed (39 → 0). The two remaining ApiError references are intentional:
      the helper itself (errors.ts) and directory-tab's friendlyDirectoryError,
      which inspects err.status/err.body for specific codes (a richer mapper,
      not the simple idiom). The inline-assign-bar / reassign-modal create flows
      deliberately keep `instanceof Error` (broader than ApiError, by design).
    first_detected: 2026-06-09
    last_detected: 2026-06-09

