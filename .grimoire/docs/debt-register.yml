# Grimoire Debt Register
# Generated by grimoire-refactor scan.
# Scope: full scan (server/src, ui/src, shared/src)
# Scanned: 2026-06-05
#
# Codebase baseline at scan time:
#   source LOC (non-test): ~23,229 across 241 files
#   test LOC: ~2,562
#   exact clones (jscpd, loose): 2.21%
#   unused files/exports/deps (knip): none
#   circular dependencies (madge): none
#
# Headline: the codebase is already lean. A blanket 20% reduction is not
# realistic through safe consolidation. Honest ceiling for low-risk
# deadweight removal is ~5-10%, concentrated in the items below.

items:
  - id: debt-001
    category: duplication
    severity: medium
    location: ui/src (~7-12 components)
    title: Two competing data-fetching patterns (manual useState/try-catch vs react-query)
    detail: >-
      @tanstack/react-query is already adopted in ~5 hooks
      (use-media-list-query, use-auth, use-media-search, etc.) but a cluster of
      components still hand-roll loading/error/data with useState + useEffect +
      try/catch. Genuine read-fetch candidates (~7): admin data-explorer,
      directory-tab, file-issues-tab, whitelist-tab, db-backup-tab, people-page,
      duplicate-reviewer. A few form/mutation components (login-page,
      upload-modal, BulkDateModal) are useMutation candidates with smaller
      savings. Each manual read carries ~15-25 lines of boilerplate (state
      decls, setLoading, setError, catch, manual refetch) that react-query
      removes, plus it loses caching/dedup/refetch the library already provides.
    fingerprint: dup-ui-fetch-boilerplate
    metrics:
      read_fetch_candidates: 7
      mutation_candidates: 3
      est_loc_recoverable: 150-300
    suggestion: >-
      Migrate read-fetch components to useQuery and form submits to useMutation,
      incrementally, one feature module at a time. Highest payoff in admin/.
    progress: >-
      Admin read tabs (file-issues, db-backup, whitelist, directory) and
      data-explorer migrated to useQuery + invalidateQueries. ACCEPTED
      RESIDUALS (deliberately kept manual): duplicate-reviewer (user-triggered
      scan + optimistic local list/decision updates) and the people hooks
      (use-people-preview relies on optimistic setPreviewMedia/setMergeSuggestions;
      use-people-list migration would change post-mutation loading-flash
      behavior for little gain). Forcing react-query on these would add code and
      risk behavior changes — net-negative. Section 5 (media mutation modals:
      upload-modal, BulkDateModal, inline-assign-bar, reassign-modal) was
      evaluated and ACCEPTED AS RESIDUAL: none read cacheable server state
      (useQuery has nothing to own) and none interact with the query cache
      (useMutation+invalidate adds no consistency benefit); upload-modal owns
      multi-file progress + an abortable name-check that react-query fits
      poorly. Converting them is churn per the plan's §5.3 escape hatch.
      Migration scope therefore complete: admin read tabs + data-explorer
      converted; everything else is a documented, deliberate residual.
    effort: large
    change_id: refactor-data-fetching
    consequences: >-
      Two patterns for the same job means contributors guess which to use;
      loading/error handling drifts; manual code re-implements caching,
      dedup, and refetch that the library already provides.
    causes: evolution
    quadrant: inadvertent-prudent
    status: in-progress
    first_detected: 2026-06-05
    last_detected: 2026-06-09

