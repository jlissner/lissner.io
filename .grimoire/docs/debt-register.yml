    first_detected: 2026-06-09
    last_detected: 2026-06-09

  - id: debt-007
    category: structural_bloat
    severity: low
    location: ui/vite.config.ts, ui/dist/assets/index-*.js
    title: No vendor chunk split — single 421 KB app+vendor bundle
    detail: >-
      Route components are already lazy-loaded (home/people/admin via
      React.lazy), but the main chunk is ~421 KB (124 KB gzip) and bundles
      vendor (react, react-dom, react-query) together with shared app code.
      There is no rollupOptions.output.manualChunks. Splitting vendor into its
      own chunk improves browser cache hit-rate across app deploys (vendor
      changes rarely). NOTE: this is a caching/perf optimization, not LOC
      reduction.
    fingerprint: bloat-no-vendor-chunk
    metrics:
      main_chunk_kb: 421
      main_chunk_gzip_kb: 124
    suggestion: >-
      Add a manualChunks function in vite.config.ts splitting node_modules into
      a `vendor` chunk (or per-lib). Measure before/after with the build output.
    effort: small
    consequences: >-
      Every app deploy busts the whole bundle cache including unchanged vendor
      code; returning users re-download ~124 KB gzip unnecessarily.
    causes: knowledge
    quadrant: inadvertent-prudent
    status: resolved
    resolution: >-
      Added rollupOptions.output.manualChunks (function form — Vite 8/rolldown
      requires a function) to vite.config.ts. Split the single 421 KB
      (125 KB gz) index chunk into react-vendor (366.6 KB / 110.9 gz),
      react-query (63.3 KB / 19.2 gz), and app index (48.7 KB / 12.9 gz).
      App-only deploys now invalidate ~49 KB instead of ~421 KB; ~130 KB gz of
      vendor stays cached.
    metrics_after:
      react_vendor_kb: 366.6
      react_query_kb: 63.3
      app_index_kb: 48.7
    first_detected: 2026-06-09
    last_detected: 2026-06-09
